<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppliers - SHERIFF SHEVVY ENTERPRISES</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header"><div class="sidebar-logo">SHERIFF SHEVVY ENTERPRISES</div>
            <nav class="sidebar-nav" id="dynamicSidebar"></nav>
            <div class="sidebar-footer"><a href="#" class="nav-item" id="logoutBtn"><span>🚪</span> Logout</a></div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="page-title">Suppliers</div>
                <button class="btn btn-primary" id="addSupplierBtn">+ Add Supplier</button>
            </header>

            <div class="content">
                <div class="card mb-4">
                    <input type="text" class="form-control" id="searchInput" placeholder="Search suppliers..." style="max-width: 400px;">
                </div>
                
                <div class="card">
                    <div class="data-table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Company</th><th>Contact</th><th>Email</th><th>Phone</th><th>City</th><th>Terms</th><th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="suppliersBody"><tr><td colspan="7" class="empty-state">Loading...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-wrapper" id="supplierModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3 class="modal-title" id="supplierModalTitle">Add Supplier</h3>
                <button class="modal-close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="supplierForm">
                    <input type="hidden" name="supplier_id" id="editingSupplierId">
                    <div class="grid grid-2">
                        <div class="form-group"><label class="form-label">Company Name *</label><input type="text" class="form-control" name="company_name" required></div>
                        <div class="form-group"><label class="form-label">Contact Person</label><input type="text" class="form-control" name="contact_person"></div>
                    </div>
                    <div class="grid grid-2">
                        <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-control" name="email"></div>
                        <div class="form-group"><label class="form-label">Phone</label><input type="tel" class="form-control" name="phone"></div>
                    </div>
                    <div class="grid grid-2">
                        <div class="form-group"><label class="form-label">City</label><input type="text" class="form-control" name="city"></div>
                        <div class="form-group"><label class="form-label">Payment Terms</label>
                            <select class="form-control form-select" name="payment_terms">
                                <option value="cod">COD (Cash on Delivery)</option>
                                <option value="transfer">Transfer</option>
                                <option value="bank_app">Bank App</option>
                                <option value="cheque">Cheque</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" id="saveSupplierBtn">Save Supplier</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/core/utils.js"></script>
    <script src="../assets/js/services/apiClient.js"></script>
    <script>
        let suppliers = [];
        let editingId = null;

        document.addEventListener('DOMContentLoaded', function() {
            const user = Utils.storage.get('user');
            return; }
            


();
            document.getElementById('searchInput').addEventListener('input', e => search(e.target.value));
            document.getElementById('addSupplierBtn').addEventListener('click', () => openModal());
            document.getElementById('saveSupplierBtn').addEventListener('click', saveSupplier);
            
            document.querySelectorAll('[data-dismiss="modal"]').forEach(btn => {
                btn.addEventListener('click', closeModal);
            });

            document.getElementById('logoutBtn').addEventListener('click', e => { 
                e.preventDefault(); 
                new AuthService().logout().then(() => window.location.href = 'login.php'); 
            });
        });

        async function loadSuppliers() {
            try {
                const pathname = window.location.pathname;
                const basePath = pathname.replace(/\/[^/]+\.html$/, '') + '/api/suppliers.php';
                const response = await fetch(basePath);
                const data = await response.json();
                if (data.success) {
                    suppliers = data.data?.data || [];
                    renderSuppliers(suppliers);
                }
            } catch (error) {
                console.error(error);
                document.getElementById('suppliersBody').innerHTML = '<tr><td colspan="7" class="empty-state">Error loading suppliers</td></tr>';
            }
        }

        function search(query) {
            const filtered = suppliers.filter(s => s.company_name.toLowerCase().includes(query.toLowerCase()) || (s.contact_person || '').toLowerCase().includes(query.toLowerCase()));
            renderSuppliers(filtered);
        }

        function renderSuppliers(data) {
            const tbody = document.getElementById('suppliersBody');
            if (!data.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No suppliers found</td></tr>'; return; }
            tbody.innerHTML = data.map(s => `
                <tr>
                    <td>${s.company_name}</td><td>${s.contact_person || '-'}</td><td>${s.email || '-'}</td><td>${s.phone || '-'}</td>
                    <td>${s.city || '-'}</td><td>${s.payment_terms || '-'}</td>
                    <td>
                        <button class="btn btn-sm" onclick="editSupplier(${s.supplier_id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteSupplier(${s.supplier_id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function openModal(supplier = null) {
            const form = document.getElementById('supplierForm');
            form.reset();
            if (supplier) {
                editingId = supplier.supplier_id;
                document.getElementById('supplierModalTitle').textContent = 'Edit Supplier';
                form.company_name.value = supplier.company_name;
                form.contact_person.value = supplier.contact_person || '';
                form.email.value = supplier.email || '';
                form.phone.value = supplier.phone || '';
                form.city.value = supplier.city || '';
                form.payment_terms.value = supplier.payment_terms || 'cod';
            } else {
                editingId = null;
                document.getElementById('supplierModalTitle').textContent = 'Add Supplier';
            }
            document.getElementById('supplierModal').classList.add('show');
        }

        function closeModal() { document.getElementById('supplierModal').classList.remove('show'); editingId = null; }

        async function saveSupplier() {
            const form = document.getElementById('supplierForm');
            const data = {
                company_name: form.company_name.value,
                contact_person: form.contact_person.value,
                email: form.email.value,
                phone: form.phone.value,
                city: form.city.value,
                payment_terms: form.payment_terms.value
            };

            if (!data.company_name) { alert('Company name is required'); return; }

            try {
                const pathname = window.location.pathname;
                const basePath = pathname.replace(/\/[^/]+\.html$/, '') + '/api/suppliers.php';
                const url = editingId ? basePath + '?id=' + editingId : basePath;
                const response = await fetch(url, {
                    method: editingId ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.success) {
                    alert(editingId ? 'Supplier updated' : 'Supplier added');
                    closeModal();
                    loadSuppliers();
                } else {
                    alert(result.message || 'Error saving');
                }
            } catch (error) { alert(error.message); }
        }

        function editSupplier(id) {
            const supplier = suppliers.find(s => s.supplier_id == id);
            if (supplier) openModal(supplier);
        }

        async function deleteSupplier(id) {
            if (!confirm('Are you sure you want to delete this supplier?')) return;
            try {
                const pathname = window.location.pathname;
                const basePath = pathname.replace(/\/[^/]+\.html$/, '') + '/api/suppliers.php';
                const response = await fetch(basePath + '?id=' + id, { method: 'DELETE' });
                const result = await response.json();
                if (result.success) {
                    alert('Supplier deleted');
                    loadSuppliers();
                } else {
                    alert(result.message || 'Error deleting');
                }
            } catch (error) { alert(error.message); }
        }
    </script>
</body>
</html>
