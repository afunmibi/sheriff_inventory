<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - SHERIFF SHEVVY ENTERPRISES</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header"><div class="sidebar-logo">SHERIFF SHEVVY ENTERPRISES</div></div>
            <nav class="sidebar-nav" id="dynamicSidebar"></nav>
            <div class="sidebar-footer"><a href="login.php" class="nav-item" id="logoutBtn"><span>🚪</span> Logout</a></div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                    <h1 class="page-title" style="margin:0;">Products</h1>
                    <a id="storefrontLink" href="#" target="_blank" style="display:none;font-size:0.75rem;color:#fbbf24;background:#1e1b4b;padding:5px 12px;border-radius:8px;text-decoration:none;font-weight:700;white-space:nowrap;">🌐 View Storefront →</a>
                </div>
                <button class="btn btn-primary" id="addProductBtn">+ Add Product</button>
            </header>

            <div class="content">
                <!-- Filters -->
                <div class="card mb-4">
                    <div class="flex gap-4 items-center">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search by name, SKU..." style="max-width: 300px;">
                        <select id="categoryFilter" class="form-control" style="max-width: 200px;">
                            <option value="">All Categories</option>
                        </select>
                        <select id="stockFilter" class="form-control" style="max-width: 200px;">
                            <option value="">All Stock Status</option>
                            <option value="in_stock">In Stock</option>
                            <option value="low_stock">Low Stock</option>
                            <option value="out_of_stock">Out of Stock</option>
                        </select>
                    </div>
                </div>

                <!-- Products Table -->
                <div class="card">
                    <div class="data-table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>SKU</th>
                                    <th>Product Name</th>
                                    <th>Category</th>
                                    <th>Cost Price</th>
                                    <th>Selling Price</th>
                                    <th>Stock</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productsBody">
                                <tr><td colspan="8" class="empty-state">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Product Modal -->
    <div class="modal-wrapper" id="productModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Add Product</h3>
                <button class="modal-close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label">Product Name *</label>
                            <input type="text" class="form-control" name="product_name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">SKU</label>
                            <input type="text" class="form-control" name="sku" placeholder="Auto-generated if empty">
                        </div>
                    </div>
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label">Category *</label>
                            <select class="form-control form-select" name="category" id="categorySelect" required>
                                <option value="">Select Category</option>
                            </select>
                            <small class="text-muted"><a href="categories.html" style="color: var(--primary);">+ Manage Categories</a></small>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Subcategory</label>
                            <input type="text" class="form-control" name="subcategory">
                        </div>
                    </div>
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label">Cost Price (₦) *</label>
                            <input type="number" class="form-control" name="cost_price" step="0.01" min="0" value="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Selling Price (₦) *</label>
                            <input type="number" class="form-control" name="selling_price" step="0.01" min="0" required>
                        </div>
                    </div>
                    <div class="grid grid-3">
                        <div class="form-group">
                            <label class="form-label">Stock Quantity</label>
                            <input type="number" class="form-control" name="quantity_on_hand" min="0" value="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Reorder Level</label>
                            <input type="number" class="form-control" name="reorder_level" min="0" value="10">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Unit of Measurement</label>
                            <select class="form-control form-select" name="unit_of_measurement">
                                <option value="pieces">Pieces</option>
                                <option value="packs">Packs</option>
                                <option value="bottles">Bottles</option>
                                <option value="kilograms">Kilograms</option>
                                <option value="meters">Meters</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label">Product Image</label>
                            <div class="flex gap-2">
                                <input type="text" class="form-control" name="image_url" id="imageUrl" placeholder="Image Path" style="background: #f1f5f9; cursor: not-allowed;" readonly>
                                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                                <button type="button" class="btn btn-secondary" onclick="document.getElementById('imageInput').click()" style="white-space: nowrap;">Browse...</button>
                                <button type="button" class="btn btn-info" id="uploadBtn" style="display: none;">Upload</button>
                            </div>
                        </div>
                        <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 25px;">
                            <input type="checkbox" name="is_featured" id="isFeatured" checked style="width: 20px; height: 20px;">
                            <label for="isFeatured" style="font-weight: 700; color: white; cursor: pointer;">Show on Storefront</label>
                        </div>
                    </div>
                    <div class="form-group" style="margin-top: 15px;">
                        <label class="form-label">Image Preview</label>
                        <div id="imagePreview" style="width: 100%; height: 150px; background: rgba(255,255,255,0.05); border: 2px dashed rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                            <span class="text-muted">No image selected</span>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" id="saveProductBtn">Save Product</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/core/utils.js"></script>
    <script src="../assets/js/services/apiClient.js"></script>
    <script>
        let allProducts = [];
        let visibleProducts = [];
        let editingId = null;

        document.addEventListener('DOMContentLoaded', () => {
            const user = Utils.storage.get('user');
            if (!user) { window.location.href = 'login.php'; return; }
            
            if (!user) { window.location.href = 'login.php'; return; }

            loadProducts();
            loadCategories();

            document.getElementById('searchInput').addEventListener('input', Utils.debounce(applyFilters, 200));
            document.getElementById('categoryFilter').addEventListener('change', applyFilters);
            // Handle Quick Add Action from Dashboard
            const params = new URLSearchParams(window.location.search);
            if (params.get('action') === 'new') {
                setTimeout(() => openModal(), 500); 
            }
            document.getElementById('addProductBtn').addEventListener('click', () => { openModal(); });
            document.getElementById('saveProductBtn').addEventListener('click', saveProduct);
            
            // Modal dismiss handling
            document.querySelectorAll('[data-dismiss="modal"]').forEach(btn => {
                btn.addEventListener('click', closeModal);
            });

            document.getElementById('imageInput').addEventListener('change', async function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const uploadBtn = document.getElementById('uploadBtn');
                uploadBtn.style.display = 'block';
                uploadBtn.textContent = 'Upload Image...';
                uploadBtn.disabled = true;

                const formData = new FormData();
                formData.append('image', file);

                try {
                    const response = await fetch('api/upload.php', {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();
                    if (result.success) {
                        document.getElementById('imageUrl').value = result.url;
                        document.getElementById('imagePreview').innerHTML = `<img src="${result.url}" style="max-height: 100%; max-width: 100%; object-fit: contain;">`;
                        Utils.showSuccess('Image uploaded successfully!');
                        uploadBtn.textContent = 'Uploaded ✅';
                        uploadBtn.classList.remove('btn-info');
                        uploadBtn.classList.add('btn-success');
                    } else {
                        throw new Error(result.message);
                    }
                } catch (error) {
                    Utils.showError(error.message || 'Upload failed');
                    uploadBtn.textContent = 'Retry Upload';
                    uploadBtn.disabled = false;
                }
            });

            document.getElementById('logoutBtn').addEventListener('click', e => {
                e.preventDefault();
                Utils.storage.remove('user');
                window.location.href = 'login.php';
            });
        });

        async function loadCategories() {
            try {
                const pathname = window.location.pathname;
                const basePath = pathname.replace(/\/[^/]+\.html$/, '') + '/api/categories.php';
                const response = await fetch(basePath);
                const result = await response.json();
                if (result.success) {
                    const categories = result.data.data || [];
                    const select = document.getElementById('categorySelect');
                    const filterSelect = document.getElementById('categoryFilter');
                    
                    const optionsHtml = categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
                    select.innerHTML = '<option value="">Select Category</option>' + optionsHtml;
                    filterSelect.innerHTML = '<option value="">All Categories</option>' + optionsHtml;
                }
            } catch (error) { console.error('Error loading categories', error); }
        }

        function getApiUrl(fileName) {
            const basePath = window.location.pathname.replace(/\/[^/]+$/, '/');
            return basePath + 'api/' + fileName;
        }

        async function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                try {
                    const url = getApiUrl('products.php?id=' + id);
                    const response = await fetch(url, { method: 'DELETE' });
                    const result = await response.json();
                    if (result.success) {
                        Utils.showSuccess('Product deleted successfully');
                        await loadProducts();
                    } else {
                        Utils.showError(result.message || 'Failed to delete product');
                    }
                } catch (error) { Utils.showError('Connection error: ' + error.message); }
            }
        }

        async function loadProducts() {
            const hub = Utils.getHubContext();
            
            // Adapt UI based on Hub
            if (hub === 'store') {
                document.querySelector('.page-title').textContent = 'Web Product Visibility';
                const base = window.location.pathname.replace(/\/[^/]+$/, '/');
                const link = document.getElementById('storefrontLink');
                link.style.display = 'inline-flex';
                link.href = base;
                const addBtn = document.getElementById('addProductBtn');
                addBtn.style.display = 'block';
                addBtn.textContent = '+ New Store Item';
                addBtn.style.background = 'var(--accent)';
                addBtn.style.color = '#1e1b4b';
                
                // Change Table Headers
                const headers = document.querySelectorAll('.data-table th');
                headers[3].textContent = 'Description';
                headers[5].textContent = 'Availability'; // Focus on front-end "In Stock" vs "Out of Stock"
                headers[6].style.display = 'none';
            } else {
                document.querySelector('.page-title').textContent = 'Inventory Management';
                document.getElementById('addProductBtn').textContent = '+ Add Product';
            }

            try {
                const url = getApiUrl('products.php?page=1&limit=1000');
                const response = await fetch(url);
                const data = await response.json();
                allProducts = data.data.data || [];
                applyFilters();
            } catch (error) {
                console.error(error);
                document.getElementById('productsBody').innerHTML = '<tr><td colspan="8" class="empty-state">Connection error</td></tr>';
            }
        }

        function applyFilters() {
            const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const stockStatus = document.getElementById('stockFilter').value;
            const hub = Utils.getHubContext();

            visibleProducts = allProducts.filter(product => {
                const matchesQuery = !query || [product.product_name, product.sku].some(v => String(v || '').toLowerCase().includes(query));
                const matchesCategory = !category || (product.category && product.category.toLowerCase() === category.toLowerCase());
                const matchesStock = !stockStatus || (product.status || 'out_of_stock') === stockStatus;
                
                // If in Store Hub, maybe show only items that COULD be featured? 
                // For now show all so they can toggle visibility
                return matchesQuery && matchesCategory && matchesStock;
            });
            renderProducts();
        }

        function renderProducts() {
            const tbody = document.getElementById('productsBody');
            const hub = Utils.getHubContext();

            if (!visibleProducts.length) {
                tbody.innerHTML = `<tr><td colspan="${hub === 'store' ? '7' : '8'}" class="empty-state">No products found</td></tr>`;
                return;
            }

            tbody.innerHTML = visibleProducts.map(product => {
                if (hub === 'store') {
                   // Storefront Hub View
                   return `
                    <tr>
                        <td><code>${product.sku || '-'}</code></td>
                        <td>${product.product_name || '-'}</td>
                        <td>${product.category || '-'}</td>
                        <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${product.description || '<span class="text-muted">No description</span>'}</td>
                        <td>${Utils.formatCurrency(product.selling_price || 0)}</td>
                        <td>
                            <span class="badge ${product.is_featured == 1 ? 'badge-success' : 'badge-warning'}">
                                ${product.is_featured == 1 ? 'LIVE ON STORE' : 'HIDDEN'}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="editProduct(${product.product_id})">Manage Visibility</button>
                        </td>
                    </tr>`;
                } else {
                   // Operations Hub View
                   return `
                    <tr>
                        <td><code>${product.sku || '-'}</code></td>
                        <td>${product.product_name || '-'}</td>
                        <td>${product.category || '<span class="text-muted">No Category</span>'}</td>
                        <td>${Utils.formatCurrency(product.cost_price || 0)}</td>
                        <td>${Utils.formatCurrency(product.selling_price || 0)}</td>
                        <td>${product.quantity_on_hand || 0}</td>
                        <td><span class="badge badge-${getStockBadge(product)}">${(product.status || 'out_of_stock').replace('_',' ').toUpperCase()}</span></td>
                        <td>
                            <button class="btn btn-sm" onclick="editProduct(${product.product_id})">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteProduct(${product.product_id})">Delete</button>
                        </td>
                    </tr>`;
                }
            }).join('');
        }

        function getStockBadge(product) {
            const status = product.status || 'out_of_stock';
            if (status === 'in_stock') return 'success';
            if (status === 'low_stock') return 'warning';
            return 'danger';
        }

        function openModal(product = null) {
            const form = document.getElementById('productForm');
            const modal = document.getElementById('productModal');
            const hub = Utils.getHubContext();
            form.reset();

            // Hub-Sensitive Modal Handling
            if (hub === 'store') {
                document.getElementById('productModal').classList.add('store-mode-product');
                document.getElementById('modalTitle').textContent = product ? 'Manage Web Visibility' : 'Feature Product';
                document.getElementById('modalTitle').classList.toggle('feature-product', !product && Utils.getHubContext() === 'store');
                if (!product && Utils.getHubContext() === 'store') {
                    document.getElementById('modalTitle').style.color = '#fbbf24';
                    document.getElementById('modalTitle').style.fontSize = '20px';
                    document.getElementById('modalTitle').style.fontWeight = '800';
                    document.getElementById('modalTitle').style.textTransform = 'uppercase';
                    document.getElementById('modalTitle').style.letterSpacing = '-0.5px';
                } else {
                    document.getElementById('modalTitle').style.color = '';
                    document.getElementById('modalTitle').style.fontSize = '';
                    document.getElementById('modalTitle').style.fontWeight = '';
                    document.getElementById('modalTitle').style.textTransform = '';
                    document.getElementById('modalTitle').style.letterSpacing = '';
                }
                // Hide purely operational logistics fields
                const logisticsFields = form.querySelectorAll('input[name="cost_price"], input[name="reorder_level"], input[name="sku"], select[name="unit_of_measurement"]');
                logisticsFields.forEach(field => {
                    const group = field.closest('.form-group');
                    if (group) group.style.display = 'none';
                });
                
                // Ensure front-end fields are visible
                form.product_name.closest('.form-group').style.display = 'block';
                form.selling_price.closest('.form-group').style.display = 'block';
                form.quantity_on_hand.closest('.form-group').style.display = 'block';
                form.quantity_on_hand.placeholder = "Current Stock Level";
            } else {
                // Restore all for Ops Hub
                document.getElementById('productModal').classList.remove('store-mode-product');
                const allFields = form.querySelectorAll('.form-group');
                allFields.forEach(group => group.style.display = 'block');
                form.quantity_on_hand.placeholder = "";
            }

            if (product) {
                editingId = product.product_id;
                document.getElementById('modalTitle').textContent = hub === 'store' ? 'Manage Web Visibility' : 'Edit Product';
                form.product_name.value = product.product_name || '';
                form.sku.value = product.sku || '';
                // Find category option regardless of case
                if (product.category) {
                    const options = Array.from(form.category.options);
                    const matchingOption = options.find(opt => opt.value.toLowerCase() === product.category.toLowerCase());
                    if (matchingOption) form.category.value = matchingOption.value;
                }
                
                form.cost_price.value = product.cost_price || 0;
                form.selling_price.value = product.selling_price || 0;
                form.quantity_on_hand.value = product.quantity_on_hand || 0;
                form.reorder_level.value = product.reorder_level || 10;
                form.unit_of_measurement.value = product.unit_of_measurement || 'pieces';
                form.description.value = product.description || '';
                form.image_url.value = product.image_url || '';
                if (product.image_url) {
                    document.getElementById('imagePreview').innerHTML = `<img src="${product.image_url}" style="max-height: 100%; max-width: 100%; object-fit: contain;">`;
                } else {
                    document.getElementById('imagePreview').innerHTML = '<span class="text-muted">No image selected</span>';
                }
                form.is_featured.checked = Number(product.is_featured) === 1;
            } else {
                editingId = null;
                document.getElementById('modalTitle').textContent = hub === 'store' ? 'Feature Product' : 'Add Product';
                document.getElementById('modalTitle').classList.toggle('feature-product', Utils.getHubContext() === 'store');
                if (hub === 'store') {
                    document.getElementById('modalTitle').style.color = '#fbbf24';
                    document.getElementById('modalTitle').style.fontSize = '20px';
                    document.getElementById('modalTitle').style.fontWeight = '800';
                    document.getElementById('modalTitle').style.textTransform = 'uppercase';
                    document.getElementById('modalTitle').style.letterSpacing = '-0.5px';
                } else {
                    document.getElementById('modalTitle').style.color = '';
                    document.getElementById('modalTitle').style.fontSize = '';
                    document.getElementById('modalTitle').style.fontWeight = '';
                    document.getElementById('modalTitle').style.textTransform = '';
                    document.getElementById('modalTitle').style.letterSpacing = '';
                }
                document.getElementById('imagePreview').innerHTML = '<span class="text-muted">No image selected</span>';
            }
            // Reset upload button
            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.style.display = 'none';
            uploadBtn.textContent = 'Upload';
            uploadBtn.classList.remove('btn-success');
            uploadBtn.classList.add('btn-info');
            
            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('show');
            editingId = null;
        }

        function editProduct(productId) {
            const product = allProducts.find(item => Number(item.product_id) === Number(productId));
            if (product) openModal(product);
        }

        async function saveProduct() {
            const form = document.getElementById('productForm');
            if (!form.product_name) {
                console.error("Form elements not found");
                return;
            }

            const payload = {
                product_name: form.product_name.value.trim(),
                sku: form.sku ? form.sku.value.trim() : '',
                category: form.category.value,
                subcategory: '', // Field not in UI, setting to empty
                cost_price: Number(form.cost_price.value || 0),
                selling_price: Number(form.selling_price.value || 0),
                quantity_on_hand: Number(form.quantity_on_hand.value || 0),
                reorder_level: Number(form.reorder_level.value || 0),
                unit_of_measurement: form.unit_of_measurement ? form.unit_of_measurement.value : 'pieces',
                description: form.description.value.trim(),
                image_url: form.image_url.value.trim(),
                is_featured: form.is_featured.checked ? 1 : 0
            };

            if (!payload.product_name || !payload.category) {
                Utils.showError('Name and Category are required');
                return;
            }

            try {
                const url = editingId ? getApiUrl('products.php?id=' + editingId) : getApiUrl('products.php');
                const response = await fetch(url, {
                    method: editingId ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.success) {
                    Utils.showSuccess(editingId ? 'Product updated' : 'Product created');
                    closeModal();
                    await loadProducts();
                } else { throw new Error(result.message); }
            } catch (error) { Utils.showError(error.message || 'Failed to save'); }
        }
    </script>
</body>
</html>
