<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tech App Computer House</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo h1 {
            font-size: 24px;
            color: var(--primary);
            margin: 0;
        }
        .login-logo p {
            font-size: 14px;
            color: #6b7280;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--gray-700);
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            transition: all 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 181, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background: var(--primary-dark);
        }
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
        }
        .login-footer a {
            color: var(--gray-500);
            font-size: 13px;
        }
        .alert {
            padding: 12px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            display: none;
        }
        .alert.show {
            display: block;
        }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <h1>Tech App Computer House</h1>
            <p>Inventory Management System</p>
        </div>

        <div class="alert alert-error" id="errorAlert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" name="email" 
                       placeholder="admin@techapp.com" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" 
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                Sign In
            </button>
        </form>

        <div class="login-footer">
            <span class="text-muted text-sm">Nigeria's Premier Computer Accessories Store</span>
        </div>
    </div>

    <script src="js/core/utils.js"></script>
    <script src="js/services/apiClient.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if already logged in
            const user = Utils.storage.get('user');
            if (user) {
                window.location.href = 'dashboard.html';
                return;
            }

            const form = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const errorAlert = document.getElementById('errorAlert');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const email = form.email.value.trim();
                const password = form.password.value;

                if (!email || !password) {
                    showError('Please enter email and password');
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.textContent = 'Signing in...';
                errorAlert.classList.remove('show');

                try {
                    // Use direct login endpoint
                    const basePath = window.location.pathname.split('/').slice(0, -1).join('/');
                    const loginUrl = basePath + '/api/login.php';
                    const response = await fetch(loginUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Store user data
                        localStorage.setItem('user', JSON.stringify(data.data.user));
                        localStorage.setItem('token', 'logged_in');
                        window.location.href = 'dashboard.html';
                    } else {
                        showError(data.message || 'Invalid credentials');
                    }
                } catch (error) {
                    showError(error.message || 'Login failed');
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            });

            function showError(message) {
                errorAlert.textContent = message;
                errorAlert.classList.add('show');
            }
        });
    </script>
</body>
</html>
