<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Tech App Computer House</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header"><div class="sidebar-logo">Tech App Computer House</div></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><span>📊</span> Dashboard</a>
                <a href="products.html" class="nav-item"><span>📦</span> Products</a>
                <a href="inventory.html" class="nav-item"><span>📋</span> Inventory</a>
                <a href="categories.html" class="nav-item active"><span>🏷️</span> Categories</a>
                <a href="sales.html" class="nav-item"><span>💰</span> Sales</a>
                <a href="suppliers.html" class="nav-item"><span>🚚</span> Suppliers</a>
                <a href="purchase-orders.html" class="nav-item"><span>📄</span> Purchase Orders</a>
                <a href="reports.html" class="nav-item"><span>📈</span> Reports</a>
                <a href="settings.html" class="nav-item"><span>⚙️</span> Settings</a>
            </nav>
            <div class="sidebar-footer"><a href="login.html" class="nav-item" id="logoutBtn"><span>🚪</span> Logout</a></div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1 class="page-title">Category Management</h1>
            </header>

            <div class="content">
                <div class="grid grid-2" style="grid-template-columns: 1fr 2fr; gap: 30px;">
                    <!-- Create Category Form -->
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Add New Category</h3></div>
                        <div class="card-body">
                            <form id="categoryForm">
                                <div class="form-group">
                                    <label class="form-label">Category Name *</label>
                                    <input type="text" class="form-control" name="name" required placeholder="e.g. Chargers, Accessories">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Description</label>
                                    <textarea class="form-control" name="description" rows="4" placeholder="Brief description of products in this category..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-full" id="saveCategoryBtn">Save Category</button>
                            </form>
                        </div>
                    </div>

                    <!-- Category List -->
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Existing Categories</h3></div>
                        <div class="data-table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Name</th><th>Description</th><th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="categoryBody">
                                    <tr><td colspan="3" class="empty-state">Loading categories...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/core/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const user = Utils.storage.get('user');
            if (!user) { window.location.href = 'login.html'; return; }

            loadCategories();
            
            document.getElementById('categoryForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.querySelector('[name="name"]').value;
                const description = document.querySelector('[name="description"]').value;
                if (!name) return;

                const saveBtn = document.getElementById('saveCategoryBtn');
                saveBtn.disabled = true;
                saveBtn.textContent = 'Saving...';

                try {
                    const pathname = window.location.pathname;
                    const basePath = pathname.replace(/\/[^/]+\.html$/, '') + '/api/categories.php';
                    const response = await fetch(basePath, {
                        method: 'POST',
                        body: JSON.stringify({ name, description })
                    });
                    const result = await response.json();
                    if (result.success) {
                        Utils.showSuccess ? Utils.showSuccess('Category added') : alert('Category added');
                        document.getElementById('categoryForm').reset();
                        loadCategories();
                    } else {
                        alert(result.message);
                    }
                } catch (e) { alert('Error: ' + e.message); }
                finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Save Category';
                }
            });

            document.getElementById('logoutBtn').addEventListener('click', e => {
                e.preventDefault();
                Utils.storage.remove('user');
                window.location.href = 'login.html';
            });
        });

        async function loadCategories() {
            try {
                const pathname = window.location.pathname;
                const basePath = pathname.replace(/\/[^/]+\.html$/, '') + '/api/categories.php';
                const response = await fetch(basePath);
                const result = await response.json();
                if (result.success) {
                    const categories = result.data.data || [];
                    const tbody = document.getElementById('categoryBody');
                    if (!categories.length) {
                        tbody.innerHTML = '<tr><td colspan="3" class="empty-state">No categories found.</td></tr>';
                        return;
                    }
                    tbody.innerHTML = categories.map(c => `
                        <tr>
                            <td><strong>${c.name}</strong><br><small class="text-muted">Added: ${new Date(c.created_at).toLocaleDateString()}</small></td>
                            <td>${c.description || '-'}</td>
                            <td>
                                <button class="btn btn-sm btn-danger" onclick="deleteCategory(${c.category_id})">Delete</button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (e) { console.error(e); }
        }

        async function deleteCategory(id) {
            if (!confirm('Are you sure? Categories in use by products cannot be deleted.')) return;
            try {
                const pathname = window.location.pathname;
                const basePath = pathname.replace(/\/[^/]+\.html$/, '') + '/api/categories.php?id=' + id;
                const response = await fetch(basePath, { method: 'DELETE' });
                const result = await response.json();
                if (result.success) {
                    loadCategories();
                } else {
                    alert(result.message);
                }
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
