<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Tech App Computer House</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header"><div class="sidebar-logo">Tech App Computer House</div></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><span>📊</span> Dashboard</a>
                <a href="products.html" class="nav-item active"><span>📦</span> Products</a>
                <a href="inventory.html" class="nav-item"><span>📋</span> Inventory</a>
                <a href="categories.html" class="nav-item"><span>🏷️</span> Categories</a>
                <a href="sales.html" class="nav-item"><span>💰</span> Sales</a>
                <a href="suppliers.html" class="nav-item"><span>🚚</span> Suppliers</a>
                <a href="purchase-orders.html" class="nav-item"><span>📄</span> Purchase Orders</a>
                <a href="reports.html" class="nav-item"><span>📈</span> Reports</a>
                <a href="settings.html" class="nav-item"><span>⚙️</span> Settings</a>
            </nav>
            <div class="sidebar-footer"><a href="login.html" class="nav-item" id="logoutBtn"><span>🚪</span> Logout</a></div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1 class="page-title">Products</h1>
                <button class="btn btn-primary" id="addProductBtn">+ Add Product</button>
            </header>

            <div class="content">
                <!-- Filters -->
                <div class="card mb-4">
                    <div class="flex gap-4 items-center">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search by name, SKU..." style="max-width: 300px;">
                        <select id="categoryFilter" class="form-control" style="max-width: 200px;">
                            <option value="">All Categories</option>
                        </select>
                        <select id="stockFilter" class="form-control" style="max-width: 200px;">
                            <option value="">All Stock Status</option>
                            <option value="in_stock">In Stock</option>
                            <option value="low_stock">Low Stock</option>
                            <option value="out_of_stock">Out of Stock</option>
                        </select>
                    </div>
                </div>

                <!-- Products Table -->
                <div class="card">
                    <div class="data-table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>SKU</th>
                                    <th>Product Name</th>
                                    <th>Category</th>
                                    <th>Cost Price</th>
                                    <th>Selling Price</th>
                                    <th>Stock</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productsBody">
                                <tr><td colspan="8" class="empty-state">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Product Modal -->
    <div class="modal-wrapper" id="productModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Add Product</h3>
                <button class="modal-close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label">Product Name *</label>
                            <input type="text" class="form-control" name="product_name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">SKU</label>
                            <input type="text" class="form-control" name="sku" placeholder="Auto-generated if empty">
                        </div>
                    </div>
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label">Category *</label>
                            <select class="form-control form-select" name="category" id="categorySelect" required>
                                <option value="">Select Category</option>
                            </select>
                            <small class="text-muted"><a href="categories.html" style="color: var(--primary);">+ Manage Categories</a></small>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Subcategory</label>
                            <input type="text" class="form-control" name="subcategory">
                        </div>
                    </div>
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label">Cost Price (₦) *</label>
                            <input type="number" class="form-control" name="cost_price" step="0.01" min="0" value="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Selling Price (₦) *</label>
                            <input type="number" class="form-control" name="selling_price" step="0.01" min="0" required>
                        </div>
                    </div>
                    <div class="grid grid-3">
                        <div class="form-group">
                            <label class="form-label">Stock Quantity</label>
                            <input type="number" class="form-control" name="quantity_on_hand" min="0" value="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Reorder Level</label>
                            <input type="number" class="form-control" name="reorder_level" min="0" value="10">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Unit of Measurement</label>
                            <select class="form-control form-select" name="unit_of_measurement">
                                <option value="pieces">Pieces</option>
                                <option value="packs">Packs</option>
                                <option value="bottles">Bottles</option>
                                <option value="kilograms">Kilograms</option>
                                <option value="meters">Meters</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Product Description</label>
                        <textarea class="form-control" name="description" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" id="saveProductBtn">Save Product</button>
            </div>
        </div>
    </div>

    <script src="js/core/utils.js"></script>
    <script src="js/services/apiClient.js"></script>
    <script>
        let allProducts = [];
        let visibleProducts = [];
        let editingId = null;

        document.addEventListener('DOMContentLoaded', () => {
            const user = Utils.storage.get('user');
            if (!user) { window.location.href = 'login.html'; return; }

            loadProducts();
            loadCategories();

            document.getElementById('searchInput').addEventListener('input', Utils.debounce(applyFilters, 200));
            document.getElementById('categoryFilter').addEventListener('change', applyFilters);
            document.getElementById('stockFilter').addEventListener('change', applyFilters);
            document.getElementById('addProductBtn').addEventListener('click', () => { openModal(); });
            document.getElementById('saveProductBtn').addEventListener('click', saveProduct);
            
            // Modal dismiss handling
            document.querySelectorAll('[data-dismiss="modal"]').forEach(btn => {
                btn.addEventListener('click', closeModal);
            });

            document.getElementById('logoutBtn').addEventListener('click', e => {
                e.preventDefault();
                Utils.storage.remove('user');
                window.location.href = 'login.html';
            });
        });

        async function loadCategories() {
            try {
                const pathname = window.location.pathname;
                const basePath = pathname.replace(/\/[^/]+\.html$/, '') + '/api/categories.php';
                const response = await fetch(basePath);
                const result = await response.json();
                if (result.success) {
                    const categories = result.data.data || [];
                    const select = document.getElementById('categorySelect');
                    const filterSelect = document.getElementById('categoryFilter');
                    
                    const optionsHtml = categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
                    select.innerHTML = '<option value="">Select Category</option>' + optionsHtml;
                    filterSelect.innerHTML = '<option value="">All Categories</option>' + optionsHtml;
                }
            } catch (error) { console.error('Error loading categories', error); }
        }

        function getApiUrl(fileName) {
            const basePath = window.location.pathname.replace(/\/[^/]+$/, '/');
            return basePath + 'api/' + fileName;
        }

        async function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                try {
                    const url = getApiUrl('products.php?id=' + id);
                    const response = await fetch(url, { method: 'DELETE' });
                    const result = await response.json();
                    if (result.success) {
                        Utils.showSuccess('Product deleted successfully');
                        await loadProducts();
                    } else {
                        Utils.showError(result.message || 'Failed to delete product');
                    }
                } catch (error) { Utils.showError('Connection error: ' + error.message); }
            }
        }

        async function loadProducts() {
            try {
                const url = getApiUrl('products.php?page=1&limit=1000');
                const response = await fetch(url);
                const data = await response.json();
                allProducts = data.data.data || [];
                applyFilters();
            } catch (error) {
                console.error(error);
                document.getElementById('productsBody').innerHTML = '<tr><td colspan="8" class="empty-state">Connection error</td></tr>';
            }
        }

        function applyFilters() {
            const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const stockStatus = document.getElementById('stockFilter').value;

            visibleProducts = allProducts.filter(product => {
                const matchesQuery = !query || [product.product_name, product.sku].some(v => String(v || '').toLowerCase().includes(query));
                const matchesCategory = !category || product.category === category;
                const matchesStock = !stockStatus || (product.status || 'out_of_stock') === stockStatus;
                return matchesQuery && matchesCategory && matchesStock;
            });
            renderProducts();
        }

        function renderProducts() {
            const tbody = document.getElementById('productsBody');
            if (!visibleProducts.length) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No products found</td></tr>';
                return;
            }
            tbody.innerHTML = visibleProducts.map(product => `
                <tr>
                    <td><code>${product.sku || '-'}</code></td>
                    <td>${product.product_name || '-'}</td>
                    <td>${product.category || '-'}</td>
                    <td>${Utils.formatCurrency(product.cost_price || 0)}</td>
                    <td>${Utils.formatCurrency(product.selling_price || 0)}</td>
                    <td>${product.quantity_on_hand || 0}</td>
                    <td><span class="badge badge-${getStockBadge(product)}">${(product.status || 'out_of_stock').replace('_',' ').toUpperCase()}</span></td>
                    <td>
                        <button class="btn btn-sm" onclick="editProduct(${product.product_id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${product.product_id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function getStockBadge(product) {
            const status = product.status || 'out_of_stock';
            if (status === 'in_stock') return 'success';
            if (status === 'low_stock') return 'warning';
            return 'danger';
        }

        function openModal(product = null) {
            const form = document.getElementById('productForm');
            const modal = document.getElementById('productModal');
            form.reset();

            if (product) {
                editingId = product.product_id;
                document.getElementById('modalTitle').textContent = 'Edit Product';
                form.product_name.value = product.product_name || '';
                form.sku.value = product.sku || '';
                form.category.value = product.category || '';
                form.cost_price.value = product.cost_price || 0;
                form.selling_price.value = product.selling_price || 0;
                form.quantity_on_hand.value = product.quantity_on_hand || 0;
                form.reorder_level.value = product.reorder_level || 10;
                form.unit_of_measurement.value = product.unit_of_measurement || 'pieces';
                form.description.value = product.description || '';
            } else {
                editingId = null;
                document.getElementById('modalTitle').textContent = 'Add Product';
            }
            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('show');
            editingId = null;
        }

        function editProduct(productId) {
            const product = allProducts.find(item => Number(item.product_id) === Number(productId));
            if (product) openModal(product);
        }

        async function saveProduct() {
            const form = document.getElementById('productForm');
            const payload = {
                product_name: form.product_name.value.trim(),
                sku: form.sku.value.trim(),
                category: form.category.value,
                subcategory: form.subcategory.value.trim(),
                cost_price: Number(form.cost_price.value || 0),
                selling_price: Number(form.selling_price.value || 0),
                quantity_on_hand: Number(form.quantity_on_hand.value || 0),
                reorder_level: Number(form.reorder_level.value || 10),
                unit_of_measurement: form.unit_of_measurement.value,
                description: form.description.value.trim()
            };

            if (!payload.product_name || !payload.category) {
                Utils.showError('Name and Category are required');
                return;
            }

            try {
                const url = editingId ? getApiUrl('products.php?id=' + editingId) : getApiUrl('products.php');
                const response = await fetch(url, {
                    method: editingId ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.success) {
                    Utils.showSuccess(editingId ? 'Product updated' : 'Product created');
                    closeModal();
                    await loadProducts();
                } else { throw new Error(result.message); }
            } catch (error) { Utils.showError(error.message || 'Failed to save'); }
        }
    </script>
</body>
</html>
